name: iOS Desktop main architecture parity

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ios-desktop-main-architecture-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IOS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  architecture:
    name: Desktop Main Authority & Architecture Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact iOS source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.IOS_EXPECTED_HEAD }}
          fetch-depth: 1

      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IOS_EXPECTED_HEAD"
          git show -s --format='source_sha=%H source_tree=%T' HEAD

      - name: Verify live Desktop main at job start
        run: python3 scripts/check-desktop-main-ios-architecture.py --authority-only

      - name: Resolve canonical Desktop-main authority lock
        id: desktop-main-lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          lock = json.loads(Path("manifests/desktop-main-authority.json").read_text(encoding="utf-8"))
          assert lock["repository"] == "bhrumom/gpui-telegram" and lock["branch"] == "main", lock
          pin_mode = lock.get("authorityPinMode", "live-main")
          assert pin_mode in {"live-main", "fixed-baseline"}, lock
          print("sha=" + lock["commit"])
          print("tree=" + lock["rootTreeSha"])
          print("pin_mode=" + pin_mode)
          PY

      - name: Checkout exact Desktop main snapshot (source-only evidence)
        uses: actions/checkout@v5
        with:
          repository: bhrumom/gpui-telegram
          ref: ${{ steps.desktop-main-lock.outputs.sha }}
          path: desktop-main-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify live Desktop-main authority and full tracked source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C desktop-main-source rev-parse HEAD)" = "${{ steps.desktop-main-lock.outputs.sha }}"
          test "$(git -C desktop-main-source rev-parse 'HEAD^{tree}')" = "${{ steps.desktop-main-lock.outputs.tree }}"
          python3 scripts/check-desktop-main-ios-architecture.py --strict --desktop-checkout desktop-main-source

      - name: Test fail-closed Desktop-main source authority contracts
        run: python3 -m unittest discover -s tests -p 'test_desktop_main_authority.py' -v

      - name: Verify App Store readiness gate script
        run: python3 .github/scripts/wait-app-store-build.py --self-test

      - name: Test protected-session login preparation
        run: node --test .github/scripts/prepare-ios-ci-session.test.mjs

      - name: Verify Desktop main remained unchanged through job
        if: always()
        run: python3 scripts/check-desktop-main-ios-architecture.py --authority-only
