name: iOS GPUI-Telegram CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ios-gpui-telegram-ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IOS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IDLE_TIMEOUT: "0"
  RUSTC_WRAPPER: "sccache"
  CI: "true"

jobs:
  authority-check:
    name: Authority & Architecture Lock Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact iOS source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.IOS_EXPECTED_HEAD }}
          fetch-depth: 1

      - name: Verify exact source checkout & live Desktop main at start
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IOS_EXPECTED_HEAD"
          git show -s --format='source_sha=%H source_tree=%T' HEAD
          python3 scripts/check-desktop-main-ios-architecture.py --authority-only

      - name: Resolve canonical bhrumom/gpui-telegram@main lock
        id: desktop-main-lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          lock = json.loads(Path("manifests/desktop-main-authority.json").read_text(encoding="utf-8"))
          assert lock["repository"] == "bhrumom/gpui-telegram" and lock["branch"] == "main", lock
          pin_mode = lock.get("authorityPinMode", "live-main")
          assert pin_mode in {"live-main", "fixed-baseline"}, lock
          print("sha=" + lock["commit"])
          print("tree=" + lock["rootTreeSha"])
          print("pin_mode=" + pin_mode)
          PY

      - name: Checkout exact bhrumom/gpui-telegram@main snapshot
        uses: actions/checkout@v5
        with:
          repository: bhrumom/gpui-telegram
          ref: ${{ steps.desktop-main-lock.outputs.sha }}
          path: desktop-main-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify strict authority lock & full tracked Git tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C desktop-main-source rev-parse HEAD)" = "${{ steps.desktop-main-lock.outputs.sha }}"
          test "$(git -C desktop-main-source rev-parse 'HEAD^{tree}')" = "${{ steps.desktop-main-lock.outputs.tree }}"
          python3 scripts/check-desktop-main-ios-architecture.py --strict --desktop-checkout desktop-main-source

      - name: Run authority checker unit tests
        run: python3 -m unittest discover -s tests -p 'test_desktop_main_authority.py' -v

      - name: Verify live Desktop main unchanged at job end
        if: always()
        run: python3 scripts/check-desktop-main-ios-architecture.py --authority-only

  rust-desktop-core-ubuntu:
    name: Rust Desktop Core Tests (Ubuntu + sccache)
    needs: [authority-check]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact iOS source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.IOS_EXPECTED_HEAD }}
          fetch-depth: 1

      - name: Verify exact source checkout & live Desktop main at start
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IOS_EXPECTED_HEAD"
          python3 scripts/check-desktop-main-ios-architecture.py --authority-only

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -o Acquire::Languages=none
          sudo apt-get install -y --no-install-recommends \
            mold clang pkg-config cmake protobuf-compiler libclang-dev \
            libssl-dev libsqlite3-dev libzstd-dev \
            libegl-dev libpipewire-0.3-dev libspa-0.2-dev libgbm-dev libdrm-dev \
            libdbus-1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust toolchain >= 1.85 (edition 2024)
        run: rustc --version && cargo --version

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            source/desktop_core -> target
          cache-on-failure: true
          shared-key: "ubuntu-m1a-desktop-core-v1"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Start sccache server
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sccache --start-server; then
              exit 0
            fi
            echo "sccache --start-server attempt $attempt failed; waiting before retry..."
            sccache --stop-server >/dev/null 2>&1 || true
            sleep $((attempt * 5))
          done
          echo "sccache server did not start cleanly; falling back to Swatinem/rust-cache without sccache wrapper"
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Compile all vendored mobile crate test targets (--no-run) & workspace libs
        env:
          GPUI_OFFLINE_TEST: "1"
        run: |
          set -euo pipefail
          cargo check --manifest-path source/desktop_core/Cargo.toml --workspace --lib
          cargo test --manifest-path source/desktop_core/Cargo.toml --no-run \
            -p gpui_telegram_core \
            -p gpui_telegram_proto \
            -p gpui_telegram_client \
            -p gpui_telegram_media \
            -p gpui_telegram_webrtc \
            -p gpui_telegram_agent \
            -p gpui_telegram_coding \
            -p magpie_gateway \
            -p bot-browser \
            -p fabushi_remote_engine \
            -p fabushi_miniapp \
            -p mahayana-computer \
            -p mahayana-host-protocol \
            -p fabushi-messaging-core
          cargo test --manifest-path source/desktop_core/Cargo.toml -p fabushi_miniapp --features server --no-run

      - name: Run full offline tests across all vendored mobile & inherited crates
        env:
          GPUI_OFFLINE_TEST: "1"
        run: |
          set -euo pipefail
          echo "=== Testing crate: gpui_telegram_core (process-isolated, -j 1 for 24-thread fence stress tests) ==="
          cargo nextest run --manifest-path source/desktop_core/Cargo.toml --no-fail-fast -j 1 \
            -p gpui_telegram_core

          echo "=== Testing crate: bot-browser (process-isolated, -j 1 for <500ms wall-clock DoS perf tests) ==="
          cargo nextest run --manifest-path source/desktop_core/Cargo.toml --no-fail-fast -j 1 \
            -p bot-browser

          echo "=== Testing 8 offline mobile crates + 3 inherited crates (process-isolated nextest) ==="
          cargo nextest run --manifest-path source/desktop_core/Cargo.toml --no-fail-fast \
            -p gpui_telegram_proto \
            -p gpui_telegram_media \
            -p gpui_telegram_webrtc \
            -p gpui_telegram_agent \
            -p gpui_telegram_coding \
            -p magpie_gateway \
            -p fabushi_remote_engine \
            -p fabushi_miniapp \
            -p mahayana-computer \
            -p mahayana-host-protocol \
            -p fabushi-messaging-core

          echo "=== Testing crate: fabushi_miniapp (--features server) ==="
          cargo nextest run --manifest-path source/desktop_core/Cargo.toml --no-fail-fast \
            -p fabushi_miniapp --features server

          echo "=== Testing crate: gpui_telegram_client (auth_client_tests loopback bridge, unsetting GPUI_OFFLINE_TEST) ==="
          env -u GPUI_OFFLINE_TEST cargo nextest run --manifest-path source/desktop_core/Cargo.toml --no-fail-fast \
            -p gpui_telegram_client \
            --test auth_client_tests

          echo "=== Testing crate: gpui_telegram_client (--lib + 14 deterministic offline integration suites) ==="
          cargo nextest run --manifest-path source/desktop_core/Cargo.toml --no-fail-fast \
            -p gpui_telegram_client \
            --lib \
            --test client_contract_and_sync_tests \
            --test m2_protocol_outbox_e2ee_proxy_tests \
            --test adversarial_data_subsystem_tests \
            --test adversarial_main_domain_tests \
            --test data_media_content_subsystem_tests \
            --test data_peers_subsystem_tests \
            --test dialogs_core_adversarial_oracle_tests \
            --test dialogs_core_subsystem_tests \
            --test history_item_subsystem_tests \
            --test main_layout_subsystem_tests \
            --test storage_adversarial_oracle_tests \
            --test storage_subsystem_tests \
            --test wallet_part2_subsystem_tests \
            --test wallet_part4_subsystem_tests

          echo "=== Testing crate: gpui_telegram_client (deterministic offline subset of 4 mixed suites, -j 1 for multithreaded race stress) ==="
          cargo nextest run --manifest-path source/desktop_core/Cargo.toml --no-fail-fast -j 1 \
            -p gpui_telegram_client \
            --test challenger_m3_adversarial_stress_tests \
            --test challenger_m3_f11_f12_adversarial_tests \
            --test challenger_m4_precedence_and_fault_tests \
            --test live_cloud_connectivity_tests \
            -E 'not test(/live_cloud|non_tokio_executor_login|ws_transport_401_terminates_loop/)'

      - name: Show sccache statistics
        if: always()
        run: sccache --show-stats || true

      - name: Verify live Desktop main unchanged at job end
        if: always()
        run: python3 scripts/check-desktop-main-ios-architecture.py --authority-only

  rust-desktop-core-ios-check:
    name: Rust Desktop Core iOS Targets Check (macOS-15 + sccache)
    needs: [authority-check]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout exact iOS source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.IOS_EXPECTED_HEAD }}
          fetch-depth: 1

      - name: Verify exact source checkout & live Desktop main at start
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IOS_EXPECTED_HEAD"
          python3 scripts/check-desktop-main-ios-architecture.py --authority-only

      - name: Verify Xcode SDKs and build tools (protoc + cmake)
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-path
          command -v protoc >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install protobuf
          command -v cmake >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Verify Rust toolchain & installed iOS targets
        run: |
          rustc --version
          rustup target list --installed

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            source/desktop_core -> target
          cache-on-failure: true
          shared-key: "macos15-m1a-ios-check-v1"

      - name: Start sccache server
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sccache --start-server; then
              exit 0
            fi
            echo "sccache --start-server attempt $attempt failed; waiting before retry..."
            sccache --stop-server >/dev/null 2>&1 || true
            sleep $((attempt * 5))
          done
          echo "sccache server did not start cleanly; falling back to Swatinem/rust-cache without sccache wrapper"
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Verify zero forbidden desktop/EGL crates in iOS dependency trees
        run: |
          set -euo pipefail
          FORBIDDEN_RE='^(gpui|khronos[-_]egl|openssl[-_]sys|xcap|keyring|webrtc|enigo|uiautomation|gpui[-_]telegram[-_]desktop|gpui[-_]telegram[-_]server|gpui[-_]telegram[-_]cli|fabushi[-_]remote[-_]daemon|fabushi[-_]miniapp[-_]wasm|gpui[-_]telegram[-_]test[-_]harness) '
          for target in aarch64-apple-ios-sim aarch64-apple-ios; do
            echo "=== Auditing workspace cargo tree for $target ==="
            TREE="$(cargo tree --color never --manifest-path source/desktop_core/Cargo.toml --workspace --target "$target" --prefix none)"
            if grep -Eq "$FORBIDDEN_RE" <<< "$TREE"; then
              echo "ERROR: Forbidden crate found in $target workspace dependency tree:"
              grep -E "$FORBIDDEN_RE" <<< "$TREE"
              exit 1
            fi
            echo "=== Auditing fabushi_miniapp (--features server) cargo tree for $target ==="
            MINIAPP_TREE="$(cargo tree --color never --manifest-path source/desktop_core/Cargo.toml -p fabushi_miniapp --features server --target "$target" --prefix none)"
            if grep -Eq "$FORBIDDEN_RE" <<< "$MINIAPP_TREE"; then
              echo "ERROR: Forbidden crate found in $target fabushi_miniapp (--features server) dependency tree:"
              grep -E "$FORBIDDEN_RE" <<< "$MINIAPP_TREE"
              exit 1
            fi
          done
          echo "PASS: Zero forbidden desktop/EGL/iOS-gated crates in iOS target dependency trees (workspace + fabushi_miniapp --features server)."

      - name: Check all vendored crates for aarch64-apple-ios-sim and aarch64-apple-ios
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "17.0"
          CFLAGS_aarch64_apple_ios: "-miphoneos-version-min=17.0"
          CFLAGS_aarch64_apple_ios_sim: "-mios-simulator-version-min=17.0"
          CARGO_ENCODED_RUSTFLAGS: "-Cembed-bitcode=no"
        run: |
          set -euo pipefail
          unset SDKROOT DEVELOPER_DIR PLATFORM_DISPLAY_NAME PLATFORM_NAME CURRENT_ARCH ARCHS
          unset CC CXX CFLAGS CXXFLAGS LDFLAGS AR RANLIB SDK_NAME
          cargo check --manifest-path source/desktop_core/Cargo.toml --workspace --lib --target aarch64-apple-ios-sim
          cargo check --manifest-path source/desktop_core/Cargo.toml --workspace --lib --target aarch64-apple-ios
          cargo check --manifest-path source/desktop_core/Cargo.toml -p fabushi_miniapp --features server --lib --target aarch64-apple-ios-sim
          cargo check --manifest-path source/desktop_core/Cargo.toml -p fabushi_miniapp --features server --lib --target aarch64-apple-ios

      - name: Show sccache statistics
        if: always()
        run: sccache --show-stats || true

      - name: Verify live Desktop main unchanged at job end
        if: always()
        run: python3 scripts/check-desktop-main-ios-architecture.py --authority-only

  rust-host-ffi-ubuntu:
    name: Rust Host C-ABI & Integration Tests (Ubuntu + sccache)
    needs: [authority-check]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact iOS source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.IOS_EXPECTED_HEAD }}
          fetch-depth: 1

      - name: Verify exact source checkout & live Desktop main at start
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IOS_EXPECTED_HEAD"
          python3 scripts/check-desktop-main-ios-architecture.py --authority-only

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -o Acquire::Languages=none
          sudo apt-get install -y --no-install-recommends \
            mold clang pkg-config cmake protobuf-compiler libclang-dev \
            libssl-dev libsqlite3-dev libzstd-dev \
            libegl-dev libpipewire-0.3-dev libspa-0.2-dev libgbm-dev libdrm-dev \
            libdbus-1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust toolchain >= 1.85 (edition 2024)
        run: rustc --version && cargo --version

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            source/host -> target
          cache-on-failure: true
          shared-key: "ubuntu-m1b-host-ffi-v1"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Start sccache server
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sccache --start-server; then
              exit 0
            fi
            echo "sccache --start-server attempt $attempt failed; waiting before retry..."
            sccache --stop-server >/dev/null 2>&1 || true
            sleep $((attempt * 5))
          done
          echo "sccache server did not start cleanly; falling back to Swatinem/rust-cache without sccache wrapper"
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Compile source/host library & all test targets (--no-run)
        run: |
          set -euo pipefail
          cargo check --manifest-path source/host/Cargo.toml --lib
          cargo test --manifest-path source/host/Cargo.toml --no-run

      - name: Execute all source/host unit and integration tests
        run: |
          set -euo pipefail
          cargo nextest run --manifest-path source/host/Cargo.toml --no-fail-fast

      - name: Verify zero leaked test artifacts in git working tree
        run: |
          set -euo pipefail
          STATUS="$(git status --porcelain --untracked-files=all -- . ':!source/host/Cargo.lock')"
          if [[ -n "$STATUS" ]]; then
            echo "ERROR: Unexpected dirty/untracked files after tests:"
            echo "$STATUS"
            exit 1
          fi
          echo "PASS: Working tree clean after source/host tests."

      - name: Show sccache statistics
        if: always()
        run: sccache --show-stats || true

      - name: Verify live Desktop main unchanged at job end
        if: always()
        run: python3 scripts/check-desktop-main-ios-architecture.py --authority-only

  rust-host-ios-staticlib:
    name: Rust Host iOS Staticlib, C11 Header & Symbol Proof (macOS-15 + sccache)
    needs: [authority-check]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout exact iOS source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.IOS_EXPECTED_HEAD }}
          fetch-depth: 1

      - name: Verify exact source checkout & live Desktop main at start
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IOS_EXPECTED_HEAD"
          python3 scripts/check-desktop-main-ios-architecture.py --authority-only

      - name: Verify Xcode SDKs and build tools (protoc + cmake)
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-path
          command -v protoc >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install protobuf
          command -v cmake >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: llvm-tools

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            source/host -> target
          cache-on-failure: true
          shared-key: "macos15-m1b-host-staticlib-v1"

      - name: Start sccache server
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sccache --start-server; then
              exit 0
            fi
            echo "sccache --start-server attempt $attempt failed; waiting before retry..."
            sccache --stop-server >/dev/null 2>&1 || true
            sleep $((attempt * 5))
          done
          echo "sccache server did not start cleanly; falling back to Swatinem/rust-cache without sccache wrapper"
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Audit source/host iOS dependency trees (zero forbidden crates)
        run: |
          set -euo pipefail
          FORBIDDEN_RE='^(gpui|khronos[-_]egl|openssl[-_]sys|xcap|keyring|webrtc|enigo|uiautomation|gpui[-_]telegram[-_]desktop|gpui[-_]telegram[-_]server|gpui[-_]telegram[-_]cli|fabushi[-_]remote[-_]daemon|fabushi[-_]miniapp[-_]wasm|gpui[-_]telegram[-_]test[-_]harness) '
          for target in aarch64-apple-ios-sim aarch64-apple-ios; do
            echo "=== Auditing source/host cargo tree for $target ==="
            TREE="$(cargo tree --color never --manifest-path source/host/Cargo.toml --target "$target" --prefix none)"
            if grep -Eq "$FORBIDDEN_RE" <<< "$TREE"; then
              echo "ERROR: Forbidden crate found in source/host $target dependency tree:"
              grep -E "$FORBIDDEN_RE" <<< "$TREE"
              exit 1
            fi
          done
          echo "PASS: Zero forbidden crates in source/host iOS dependency trees."

      - name: Build libmahayana_app_host.a for iphonesimulator and iphoneos
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/source/host/target
          CONFIGURATION: Release
          FORCE_RELEASE: "1"
          IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        run: |
          set -euo pipefail
          bash scripts/build-mahayana-ios.sh iphonesimulator arm64
          bash scripts/build-mahayana-ios.sh iphoneos arm64

      - name: Verify C11 header syntax against both iOS SDKs
        run: |
          set -euo pipefail
          xcrun --sdk iphonesimulator clang -fsyntax-only -std=c11 -Wall -Wextra -Werror source/host/include/mahayana_app_host.h
          xcrun --sdk iphoneos clang -fsyntax-only -std=c11 -Wall -Wextra -Werror source/host/include/mahayana_app_host.h
          echo "PASS: source/host/include/mahayana_app_host.h passed strict C11 -Wall -Wextra -Werror on iphonesimulator & iphoneos."

      - name: Verify all 29 exported Mach-O C-ABI symbols and arm64 architecture on both staticlibs
        run: |
          set -euo pipefail
          SYSROOT="$(rustc --print sysroot)"
          HOST_TRIPLE="$(rustc -vV | awk '/^host:/ {print $2}')"
          LLVM_NM="$SYSROOT/lib/rustlib/$HOST_TRIPLE/bin/llvm-nm"
          test -x "$LLVM_NM"
          REQUIRED_SYMBOLS=(
            _fabushi_host_create
            _fabushi_host_dispatch
            _fabushi_host_poll_events
            _fabushi_host_cancel
            _fabushi_host_destroy
            _fabushi_host_free_string
            _fabushi_host_last_error
            _telegram_app_host_create
            _telegram_app_host_create_test
            _telegram_app_host_last_error
            _telegram_app_host_dispatch
            _telegram_app_host_dispatch_with_handle
            _telegram_bridge_register_event_callback
            _telegram_app_host_free_string
            _telegram_app_host_destroy
            _telegram_replay_window_create
            _telegram_replay_window_check_and_add
            _telegram_replay_window_destroy
            _telegram_proto_max_packet_size
            _mahayana_app_host_create
            _mahayana_app_host_create_with_storage_passphrase
            _mahayana_app_host_create_test
            _mahayana_app_host_last_error
            _mahayana_app_host_dispatch_with_handle
            _mahayana_app_host_dispatch
            _mahayana_app_host_free_string
            _mahayana_app_host_destroy
            _mahayana_cloud_agent_trace_rows
            _mahayana_spreadsheet_parse_file
          )
          for lib in build/rust/iphonesimulator/libmahayana_app_host.a build/rust/iphoneos/libmahayana_app_host.a; do
            echo "=== Inspecting $lib ==="
            test -s "$lib"
            lipo -info "$lib" | grep -q "arm64"
            SYMBOLS="$("$LLVM_NM" -gU "$lib")"
            for sym in "${REQUIRED_SYMBOLS[@]}"; do
              if ! grep -Eq "[[:space:]]T[[:space:]]+${sym}$" <<< "$SYMBOLS"; then
                echo "ERROR: Missing global text symbol ${sym} in ${lib}"
                exit 1
              fi
            done
            echo "PASS: All ${#REQUIRED_SYMBOLS[@]} required Mach-O C-ABI symbols verified in ${lib}."
          done

      - name: Verify Apple Xcode ld linkability against both iOS SDKs
        run: |
          set -euo pipefail
          TMPDIR_LINK="$(mktemp -d)"
          trap 'rm -rf "$TMPDIR_LINK"' EXIT
          cat <<'EOF' > "$TMPDIR_LINK/link_check.c"
          #include <stddef.h>
          #include <stdint.h>
          #include "mahayana_app_host.h"
          int main(void) {
            void * volatile syms[] = {
              (void *)fabushi_host_create,
              (void *)fabushi_host_dispatch,
              (void *)fabushi_host_poll_events,
              (void *)fabushi_host_cancel,
              (void *)fabushi_host_destroy,
              (void *)fabushi_host_free_string,
              (void *)fabushi_host_last_error,
              (void *)telegram_app_host_create,
              (void *)telegram_app_host_create_test,
              (void *)telegram_app_host_last_error,
              (void *)telegram_app_host_dispatch,
              (void *)telegram_app_host_dispatch_with_handle,
              (void *)telegram_bridge_register_event_callback,
              (void *)telegram_app_host_free_string,
              (void *)telegram_app_host_destroy,
              (void *)telegram_replay_window_create,
              (void *)telegram_replay_window_check_and_add,
              (void *)telegram_replay_window_destroy,
              (void *)telegram_proto_max_packet_size,
              (void *)mahayana_app_host_create,
              (void *)mahayana_app_host_create_with_storage_passphrase,
              (void *)mahayana_app_host_create_test,
              (void *)mahayana_app_host_last_error,
              (void *)mahayana_app_host_dispatch_with_handle,
              (void *)mahayana_app_host_dispatch,
              (void *)mahayana_app_host_free_string,
              (void *)mahayana_app_host_destroy,
              (void *)mahayana_cloud_agent_trace_rows,
              (void *)mahayana_spreadsheet_parse_file
            };
            volatile uintptr_t acc = 0;
            for (size_t i = 0; i < sizeof(syms) / sizeof(syms[0]); ++i) {
              if (syms[i] == NULL) {
                return 1;
              }
              acc ^= (uintptr_t)syms[i];
            }
            return acc == 0 ? 2 : 0;
          }
          EOF
          xcrun --sdk iphonesimulator clang -arch arm64 -mios-simulator-version-min=17.0 -std=c11 \
            -Wl,-dead_strip \
            -I source/host/include "$TMPDIR_LINK/link_check.c" \
            build/rust/iphonesimulator/libmahayana_app_host.a \
            -framework Foundation -framework Security -framework CoreFoundation -framework SystemConfiguration \
            -liconv -lresolv -lz -o "$TMPDIR_LINK/link_sim"
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0 -std=c11 \
            -Wl,-dead_strip \
            -I source/host/include "$TMPDIR_LINK/link_check.c" \
            build/rust/iphoneos/libmahayana_app_host.a \
            -framework Foundation -framework Security -framework CoreFoundation -framework SystemConfiguration \
            -liconv -lresolv -lz -o "$TMPDIR_LINK/link_ios"
          echo "PASS: Apple Xcode ld (-Wl,-dead_strip) linked all 29 C-ABI symbols cleanly for iphonesimulator & iphoneos."

      - name: Compute SHA-256 checksums for iOS staticlib artifacts
        run: |
          set -euo pipefail
          shasum -a 256 \
            build/rust/iphonesimulator/libmahayana_app_host.a \
            build/rust/iphoneos/libmahayana_app_host.a \
            source/host/include/mahayana_app_host.h | tee build/rust/SHA256SUMS.txt

      - name: Upload iOS Rust staticlib artifacts & checksums
        uses: actions/upload-artifact@v4
        with:
          name: fabushi-rust-host-ios-staticlibs-${{ env.IOS_EXPECTED_HEAD }}
          path: |
            build/rust/iphonesimulator/libmahayana_app_host.a
            build/rust/iphoneos/libmahayana_app_host.a
            build/rust/SHA256SUMS.txt
            source/host/include/mahayana_app_host.h
          retention-days: 14
          if-no-files-found: error
          overwrite: true

      - name: Show sccache statistics
        if: always()
        run: sccache --show-stats || true

      - name: Verify live Desktop main unchanged at job end
        if: always()
        run: python3 scripts/check-desktop-main-ios-architecture.py --authority-only

  ios-sim-build-and-test:
    name: iOS Simulator Build & Swift 6 XCTest Suite (macOS-15)
    runs-on: macos-15
    needs: [authority-check, rust-host-ios-staticlib]
    timeout-minutes: 60
    steps:
      - name: Checkout exact iOS source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.IOS_EXPECTED_HEAD }}
          fetch-depth: 1

      - name: Verify exact source checkout, Xcode 16.4 & live Desktop main at start
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IOS_EXPECTED_HEAD"
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          swift --version
          python3 scripts/check-desktop-main-ios-architecture.py --authority-only

      - name: Download verified iOS Rust staticlibs
        uses: actions/download-artifact@v4
        with:
          name: fabushi-rust-host-ios-staticlibs-${{ env.IOS_EXPECTED_HEAD }}
          path: ${{ runner.temp }}/rust-staticlibs

      - name: Verify SHA-256 digests and install prebuilt staticlibs
        shell: bash
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/rust-staticlibs"
          diff -u source/host/include/mahayana_app_host.h "$STAGE/source/host/include/mahayana_app_host.h"
          mkdir -p build/rust/iphonesimulator build/rust/iphoneos
          cp "$STAGE/build/rust/iphonesimulator/libmahayana_app_host.a" build/rust/iphonesimulator/libmahayana_app_host.a
          cp "$STAGE/build/rust/iphoneos/libmahayana_app_host.a" build/rust/iphoneos/libmahayana_app_host.a
          cp "$STAGE/build/rust/SHA256SUMS.txt" build/rust/SHA256SUMS.txt
          shasum -a 256 -c build/rust/SHA256SUMS.txt

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen --version

      - name: Cache SwiftPM source packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: macos15-spm-${{ hashFiles('mobile/ios/project.yml') }}
          restore-keys: |
            macos15-spm-

      - name: Generate Fabushi.xcodeproj via XcodeGen
        working-directory: mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          test -d Fabushi.xcodeproj

      - name: Select and boot runtime-matched iPhone Simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          SDK_VER="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          SIM_JSON="${RUNNER_TEMP}/simctl-devices.json"
          xcrun simctl list devices available -j > "$SIM_JSON"
          UDID="$(python3 - "$SDK_VER" "$SIM_JSON" <<'PY'
          import json, sys
          sdk_tag = "iOS-" + sys.argv[1].replace(".", "-")
          with open(sys.argv[2], encoding="utf-8") as fh:
              devices = json.load(fh)["devices"]
          def pick(match_runtime):
              for rt, xs in sorted(devices.items()):
                  if not match_runtime(rt):
                      continue
                  for x in xs:
                      if x.get("isAvailable") and x.get("name", "").startswith("iPhone"):
                          return x["udid"], x["name"], rt
              return None
          chosen = (
              pick(lambda rt: rt.endswith(sdk_tag))
              or pick(lambda rt: "SimRuntime.iOS-18-" in rt)
              or pick(lambda rt: "SimRuntime.iOS-" in rt)
          )
          if not chosen:
              raise SystemExit("No available iPhone Simulator found")
          print(f"Selected simulator: {chosen[1]} ({chosen[0]}) [{chosen[2]}]", file=sys.stderr)
          print(chosen[0])
          PY
          )"
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl erase "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "sdk_ver=$SDK_VER" >> "$GITHUB_OUTPUT"

      - name: Build and run FabushiTests on iOS Simulator (Swift 6 + Keychain + Loopback)
        working-directory: mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="${RUNNER_TEMP}/ios-sim-evidence"
          mkdir -p "$EVIDENCE_DIR"
          rm -rf "$EVIDENCE_DIR/FabushiTests.xcresult"
          # NOTE 1: Do NOT pass CODE_SIGNING_ALLOWED=NO on iOS Simulator; Xcode ad-hoc signs
          # Simulator binaries with Fabushi.entitlements so real Security.framework Keychain
          # calls succeed natively without -34018 (errSecMissingEntitlement).
          # NOTE 2: Match IPHONEOS_DEPLOYMENT_TARGET to the booted iOS 18.5 Simulator SDK
          # (while keeping mobile/ios/project.yml at iOS 17.0 for device archives) so Xcode 16.4
          # ld_prime binds WebKit directly to WebKit.framework instead of the removed iOS 18.5
          # Simulator dyld-cache entry /usr/lib/swift/libswiftWebKit.dylib.
          # TODO(M6): Retire/port verified pre-existing 8128951 legacy Stratum A suites; Final Milestone MUST have 0 -skip-testing flags
          xcodebuild test \
            -project Fabushi.xcodeproj \
            -scheme Fabushi \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "${RUNNER_TEMP}/FabushiSimDerivedData" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/SourcePackages" \
            -resultBundlePath "$EVIDENCE_DIR/FabushiTests.xcresult" \
            -only-testing:FabushiTests \
            -skip-testing:FabushiTests/AccessCoverParityTests \
            -skip-testing:FabushiTests/AttachmentMainRPCParityTests \
            -skip-testing:FabushiTests/BoxSecretsParityTests \
            -skip-testing:FabushiTests/ClientSideToolV2RelayParityTests \
            -skip-testing:FabushiTests/CoordinatorAdapterTests \
            -skip-testing:FabushiTests/CoordinatorContractTests \
            -skip-testing:FabushiTests/CoordinatorMcpSurfaceTests \
            -skip-testing:FabushiTests/CursorModelCatalogParityTests \
            -skip-testing:FabushiTests/GatewayParityTests \
            -skip-testing:FabushiTests/GrokMobileBotServiceTests \
            -skip-testing:FabushiTests/GrokMobileCommandPaletteTests \
            -skip-testing:FabushiTests/IOSLifecycleParityTests \
            -skip-testing:FabushiTests/IOSPlatformMainParityTests \
            -skip-testing:FabushiTests/MobileComposerParityTests \
            -skip-testing:FabushiTests/MobileMermaidRendererParityTests \
            -skip-testing:FabushiTests/PreloadParityTests \
            -skip-testing:FabushiTests/ProductionSentryParityTests \
            -skip-testing:FabushiTests/RemoteComputerRebuildTests \
            -skip-testing:FabushiTests/RunnerParityTests \
            -skip-testing:FabushiTests/SharedMcpToolsDiscoveryParityTests \
            -skip-testing:FabushiTests/SharedSettingsParityTests \
            -skip-testing:FabushiTests/SharedWorkflowTranscriptParityTests \
            IPHONEOS_DEPLOYMENT_TARGET="${{ steps.sim.outputs.sdk_ver }}" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_STYLE=Automatic \
            FABUSHI_USE_PREBUILT_RUST_HOST=1 \
            2>&1 | tee "$EVIDENCE_DIR/xcodebuild-sim-test.log"

          xcrun xcresulttool get test-results summary --path "$EVIDENCE_DIR/FabushiTests.xcresult" \
            | tee "$EVIDENCE_DIR/test-summary.json"
          python3 - "$EVIDENCE_DIR/test-summary.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1], encoding="utf-8"))
          passed = summary.get("passedTests", 0)
          failed = summary.get("failedTests", 0)
          skipped = summary.get("skippedTests", 0)
          expected_failures = summary.get("expectedFailures", 0)
          print(
              f"FabushiTests summary: passed={passed} failed={failed} "
              f"skipped={skipped} expectedFailures={expected_failures}"
          )
          assert (
              passed >= 966 and failed == 0 and skipped == 0 and expected_failures == 0
          ), f"Unexpected XCTest summary: {summary}"
          PY

      - name: Package Simulator test results & compute SHA-256 checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="${RUNNER_TEMP}/ios-sim-evidence"
          mkdir -p "$EVIDENCE_DIR"
          cd "$EVIDENCE_DIR"
          FILES=()
          if [ -d "FabushiTests.xcresult" ]; then
            rm -f FabushiTests.xcresult.zip
            zip -rq FabushiTests.xcresult.zip FabushiTests.xcresult
            rm -rf FabushiTests.xcresult
            FILES+=(FabushiTests.xcresult.zip)
          fi
          if [ -f "test-summary.json" ]; then
            FILES+=(test-summary.json)
          fi
          if [ -f "xcodebuild-sim-test.log" ]; then
            FILES+=(xcodebuild-sim-test.log)
          fi
          test "${#FILES[@]}" -gt 0
          shasum -a 256 "${FILES[@]}" | tee SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt

      - name: Upload iOS Simulator test evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabushi-ios-sim-tests-${{ env.IOS_EXPECTED_HEAD }}
          path: ${{ runner.temp }}/ios-sim-evidence/
          retention-days: 14
          if-no-files-found: error
          overwrite: true

      - name: Shutdown and erase iOS Simulator
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          if [ -n "$UDID" ]; then
            xcrun simctl shutdown "$UDID" 2>/dev/null || true
            xcrun simctl erase "$UDID" 2>/dev/null || true
          fi

      - name: Verify live Desktop main unchanged at job end
        if: always()
        run: python3 scripts/check-desktop-main-ios-architecture.py --authority-only

  ios-device-archive:
    name: Unsigned iOS Device Release Archive (arm64, macOS-15)
    runs-on: macos-15
    needs: [authority-check, rust-host-ios-staticlib]
    timeout-minutes: 60
    steps:
      - name: Checkout exact iOS source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.IOS_EXPECTED_HEAD }}
          fetch-depth: 1

      - name: Verify exact source checkout, Xcode 16.4 & live Desktop main at start
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IOS_EXPECTED_HEAD"
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          swift --version
          python3 scripts/check-desktop-main-ios-architecture.py --authority-only

      - name: Download verified iOS Rust staticlibs
        uses: actions/download-artifact@v4
        with:
          name: fabushi-rust-host-ios-staticlibs-${{ env.IOS_EXPECTED_HEAD }}
          path: ${{ runner.temp }}/rust-staticlibs

      - name: Verify SHA-256 digests and install prebuilt staticlibs
        shell: bash
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/rust-staticlibs"
          diff -u source/host/include/mahayana_app_host.h "$STAGE/source/host/include/mahayana_app_host.h"
          mkdir -p build/rust/iphonesimulator build/rust/iphoneos
          cp "$STAGE/build/rust/iphonesimulator/libmahayana_app_host.a" build/rust/iphonesimulator/libmahayana_app_host.a
          cp "$STAGE/build/rust/iphoneos/libmahayana_app_host.a" build/rust/iphoneos/libmahayana_app_host.a
          cp "$STAGE/build/rust/SHA256SUMS.txt" build/rust/SHA256SUMS.txt
          shasum -a 256 -c build/rust/SHA256SUMS.txt

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen --version

      - name: Cache SwiftPM source packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: macos15-spm-${{ hashFiles('mobile/ios/project.yml') }}
          restore-keys: |
            macos15-spm-

      - name: Generate Fabushi.xcodeproj via XcodeGen
        working-directory: mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          test -d Fabushi.xcodeproj

      - name: Build unsigned Release iOS device archive (arm64)
        working-directory: mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_DIR="${RUNNER_TEMP}/ios-archive-evidence"
          mkdir -p "$ARCHIVE_DIR"
          rm -rf "$ARCHIVE_DIR/Fabushi.xcarchive"
          xcodebuild archive \
            -project Fabushi.xcodeproj \
            -scheme Fabushi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${RUNNER_TEMP}/FabushiArchiveDerivedData" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/SourcePackages" \
            -archivePath "$ARCHIVE_DIR/Fabushi.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            FABUSHI_USE_PREBUILT_RUST_HOST=1 \
            2>&1 | tee "$ARCHIVE_DIR/xcodebuild-device-archive.log"

      - name: Verify archived Fabushi.app, Broadcast extension (arm64), Info.plist ATS & dylib hygiene
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/ios-archive-evidence/Fabushi.xcarchive"
          APP="$ARCHIVE/Products/Applications/Fabushi.app"
          APPEX="$APP/PlugIns/FabushiBroadcastUpload.appex"
          test -d "$APP" && test -x "$APP/Fabushi"
          test -d "$APPEX" && test -x "$APPEX/FabushiBroadcastUpload"
          lipo -info "$APP/Fabushi" | grep -q "arm64"
          lipo -info "$APPEX/FabushiBroadcastUpload" | grep -q "arm64"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")" = "17.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APPEX/Info.plist")" = "17.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsArbitraryLoads' "$APP/Info.plist")" = "false"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsLocalNetworking' "$APP/Info.plist")" = "true"
          for bin in "$APP/Fabushi" "$APPEX/FabushiBroadcastUpload"; do
            OTOOL_OUT="$(otool -L "$bin")"
            DEPS="$(printf '%s\n' "$OTOOL_OUT" | tail -n +2)"
            test -n "$DEPS"
            if grep -Eq "libmahayana_app_host\.dylib|/Users/|/opt/homebrew" <<< "$DEPS"; then
              echo "ERROR: Forbidden dynamic library reference in $bin:" >&2
              printf '%s\n' "$DEPS" >&2
              exit 1
            fi
          done
          echo "PASS: Fabushi.app + FabushiBroadcastUpload.appex (arm64, MinimumOSVersion=17.0, ATS, dylib hygiene) verified cleanly."

      - name: Package xcarchive & compute SHA-256 checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_DIR="${RUNNER_TEMP}/ios-archive-evidence"
          mkdir -p "$ARCHIVE_DIR"
          cd "$ARCHIVE_DIR"
          FILES=()
          if [ -d "Fabushi.xcarchive" ]; then
            rm -f Fabushi.xcarchive.zip
            zip -rq Fabushi.xcarchive.zip Fabushi.xcarchive
            rm -rf Fabushi.xcarchive
            FILES+=(Fabushi.xcarchive.zip)
          fi
          if [ -f "xcodebuild-device-archive.log" ]; then
            FILES+=(xcodebuild-device-archive.log)
          fi
          test "${#FILES[@]}" -gt 0
          shasum -a 256 "${FILES[@]}" | tee SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt

      - name: Upload iOS device archive evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabushi-ios-device-archive-${{ env.IOS_EXPECTED_HEAD }}
          path: ${{ runner.temp }}/ios-archive-evidence/
          retention-days: 14
          if-no-files-found: error
          overwrite: true

      - name: Verify live Desktop main unchanged at job end
        if: always()
        run: python3 scripts/check-desktop-main-ios-architecture.py --authority-only
