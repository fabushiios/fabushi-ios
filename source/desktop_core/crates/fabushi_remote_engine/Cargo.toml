[package]
name = "fabushi_remote_engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui_telegram_core = { workspace = true }
gpui_telegram_proto = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
image = { workspace = true }
libc = "0.2"

# iOS target_os adaptation: xcap has no iOS backend; iOS uses ReplayKit Broadcast Upload Extension.
[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
xcap = "0.9.8"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = { version = "0.25", features = ["highsierra"] }
foreign-types = "0.5"
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6.1", features = ["wayland"] }

[target.'cfg(target_os = "windows")'.dependencies]
enigo = "0.6.1"

[dev-dependencies]
tempfile = "3"
