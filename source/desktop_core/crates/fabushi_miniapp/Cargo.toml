[package]
name = "fabushi_miniapp"
version = "1.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Pure-Rust shared Mini App core and standalone server for Global Dharma Offering & Zen Room"

[features]
default = []
server = [
    "dep:rusqlite",
    "dep:chrono",
    "dep:uuid",
    "dep:axum",
    "dep:tokio",
    "dep:reqwest",
    "dep:tower-http",
    "dep:sha2",
    "dep:hmac",
    "dep:subtle",
    "dep:parking_lot",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[[bin]]
name = "fabushi_miniapp_server"
path = "src/bin/fabushi_miniapp_server.rs"
required-features = ["server"]

[[bin]]
name = "publish_fabushi_miniapp"
path = "src/bin/publish_fabushi_miniapp.rs"
required-features = ["server"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled", "backup", "blob"], optional = true }
chrono = { version = "0.4", features = ["serde", "clock"], optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
axum = { version = "0.8", features = ["macros"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tower-http = { version = "0.6", features = ["cors", "trace"], optional = true }
sha2 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
subtle = { version = "2.6", optional = true }
parking_lot = { version = "0.12", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
