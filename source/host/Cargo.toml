[package]
name = "mahayana-mobile-bridge"
version = "1.6.9"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
build = false

[lib]
name = "mahayana_app_host"
crate-type = ["staticlib", "rlib"]

[dependencies]
# All 11 vendored v1.6.9 pure-Rust mobile domain crates in source/desktop_core
gpui_telegram_core = { path = "../desktop_core/crates/gpui_telegram_core" }
gpui_telegram_proto = { path = "../desktop_core/crates/gpui_telegram_proto" }
gpui_telegram_client = { path = "../desktop_core/crates/gpui_telegram_client" }
gpui_telegram_media = { path = "../desktop_core/crates/gpui_telegram_media" }
gpui_telegram_webrtc = { path = "../desktop_core/crates/gpui_telegram_webrtc" }
gpui_telegram_agent = { path = "../desktop_core/crates/gpui_telegram_agent" }
gpui_telegram_coding = { path = "../desktop_core/crates/gpui_telegram_coding" }
magpie_gateway = { path = "../desktop_core/crates/magpie_gateway" }
bot-browser = { path = "../desktop_core/crates/bot-browser" }
fabushi_remote_engine = { path = "../desktop_core/crates/fabushi_remote_engine" }
fabushi_miniapp = { path = "../desktop_core/crates/fabushi_miniapp", features = ["server"] }

# Vendored inherited domain crates
fabushi-messaging-core = { path = "../desktop_core/inherited/mahayana-messaging" }
mahayana-host-runtime = { path = "../desktop_core/inherited/host" }
mahayana-computer = { path = "../desktop_core/inherited/mahayana-rs/mahayana-computer" }
mahayana-host-protocol = { path = "../desktop_core/inherited/mahayana-rs/mahayana-host-protocol" }

# Local full-text Tantivy index (pure Rust + mmap, zero C zstd/openssl deps)
tantivy = { version = "0.22", default-features = false, features = ["mmap"] }

# Async runtime, persistence, cryptography & utilities
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
rusqlite = { version = "0.39", features = ["bundled", "backup", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
tracing = "0.1"
zeroize = "1"
thiserror = "2"
parking_lot = "0.12"
libc = "0.2"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
getrandom = "0.2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
subtle = "2.6"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"

[profile.dev]
opt-level = 0
debug = 0
strip = "debuginfo"
incremental = false
codegen-units = 256

[profile.test]
opt-level = 0
debug = 0
strip = "debuginfo"
incremental = false
codegen-units = 16

[profile.test.package.argon2]
opt-level = 3

[profile.test.package.blake2]
opt-level = 3

[profile.release]
# Keep default panic = "unwind" so catch_unwind works across every C-ABI boundary!
# Keep strip = "debuginfo" (NOT "symbols") so Mach-O exported C-ABI symbols stay visible to nm/ld.
opt-level = "z"
lto = "thin"
codegen-units = 1
debug = 0
strip = "debuginfo"
incremental = false
